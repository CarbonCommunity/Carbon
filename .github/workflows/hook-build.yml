name: Protocol Hooks Build
concurrency: build-protocol-hooks

on:
  workflow_dispatch:
    inputs:
      protocol:
        description: 'Carbon Protocol'
        required: true
        default: '2026.MM.DD.0'
        type: string

      carbon_branch:
        description: 'Carbon Branch'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - preview
          - production
          - rust_beta/release
          - rust_beta/staging
          - rust_beta/aux01
          - rust_beta/aux02
          - rust_beta/aux03
          - rust_beta/aux04
          - carbon_3.0

      rust_branch:
        description: 'Rust Branch'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - release
          - staging
          - aux01
          - aux02
          - aux03
          - aux04

      debug:
        description: 'Debug Hooks'
        required: true
        default: 'true'
        type: boolean

      release:
        description: 'Release Hooks'
        required: true
        default: 'true'
        type: boolean

      oxide_hooks_override:
        description: 'Oxide Hooks Override'
        required: false
        default: ''
        type: string

env:
  DISCORD_HOOK_WH: ${{ secrets.DISCORD_HOOK_WH }}
  PROTOCOL: ${{ inputs.protocol }}
  RUST_BRANCH: ${{ inputs.rust_branch }}
  DEBUG_BUILD: ${{ inputs.debug }}
  RELEASE_BUILD: ${{ inputs.release }}
  OXIDE_HOOKS_OVERRIDE: ${{ inputs.oxide_hooks_override }}
  ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  build:
    name: Hooks Build
    runs-on: windows-latest
    continue-on-error: false

    steps:
      - name: Configure Git
        shell: bash
        run: |
          git config --global fetch.parallel 0
          git config --global submodule.fetchJobs 0

      - name: Git Clone
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.carbon_branch }}
          submodules: recursive

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Build Hooks
        shell: cmd
        run: |
          set OXIDE_HOOKS=https://api.carbonmod.gg/oxide/%RUST_BRANCH%.opj

          if NOT "%OXIDE_HOOKS_OVERRIDE%" EQU "" (
              set OXIDE_HOOKS=%OXIDE_HOOKS_OVERRIDE%
          )

          set ROOT=%GITHUB_WORKSPACE%\src\Carbon.Hooks\Carbon.Hooks.Generator\scripts
          
          if %DEBUG_BUILD% EQU true (
              cd %ROOT%
              echo Debug build is enabled.
              call build.bat Debug %RUST_BRANCH% %PROTOCOL% %OXIDE_HOOKS%
          ) else (
              echo Debug build is disabled.
          )
          
          if %RELEASE_BUILD% EQU true (
              cd %ROOT%
              echo Release build is enabled.
              call build.bat Release %RUST_BRANCH% %PROTOCOL% %OXIDE_HOOKS%
          ) else (
              echo Release build is disabled.
          )
          
          cd %ROOT%
          call discord.bat %RUST_BRANCH% %PROTOCOL%

      - name: ⬆️ Artifacts - Upload
        uses: actions/upload-artifact@v7
        with:
          name: FTP Output
          path: |
            src/Carbon.Hooks/Carbon.Hooks.Generator/ftp/*

      - name: ⬆️ SFTP - Upload Hooks
        if: ${{ inputs.debug || inputs.release }}
        shell: pwsh
        env:
          SFTP_HOST: redist.carbonmod.gg
          SFTP_PORT: 22
          SFTP_USER: carbonmod
          # Remote folder holding 'server/<target>/<protocol>', relative to the SSH user's login folder (or absolute)
          SFTP_ROOT: /home/carbonmod/public_html/cdn.carbonmod.gg/hooks
          # Private key of the SSH user (OpenSSH format, no passphrase)
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          # Optional 'ssh-keyscan' output for the host; when empty the host key is trusted on first use
          SFTP_KNOWN_HOSTS: ${{ vars.SFTP_KNOWN_HOSTS }}
        run: |
          if (-not $env:SFTP_KEY) { throw 'The SFTP_KEY secret is not set.' }

          $key = Join-Path $env:RUNNER_TEMP 'sftp_key'
          $knownHosts = Join-Path $env:RUNNER_TEMP 'sftp_known_hosts'
          $batch = Join-Path $env:RUNNER_TEMP 'sftp_batch.txt'

          try {
            # OpenSSH wants LF line endings and refuses private keys other accounts can read
            [IO.File]::WriteAllText($key, ($env:SFTP_KEY.Trim() -replace "`r", '') + "`n")
            icacls $key /inheritance:r /grant:r "$($env:USERNAME):(F)" | Out-Null

            $options = @('-b', $batch, '-i', $key, '-P', $env:SFTP_PORT, '-o', 'IdentitiesOnly=yes')

            if ($env:SFTP_KNOWN_HOSTS) {
              [IO.File]::WriteAllText($knownHosts, ($env:SFTP_KNOWN_HOSTS.Trim() -replace "`r", '') + "`n")
              $options += '-o', 'StrictHostKeyChecking=yes', '-o', "UserKnownHostsFile=$($knownHosts -replace '\', '/')"
            } else {
              Write-Output '::warning::SFTP_KNOWN_HOSTS is not set, the SFTP host key is not being verified.'
              $options += '-o', 'StrictHostKeyChecking=accept-new'
            }

            $targets = @()
            if ($env:DEBUG_BUILD -eq 'true') { $targets += 'debug', 'debugunix' }
            if ($env:RELEASE_BUILD -eq 'true') { $targets += 'release', 'releaseunix' }

            $commands = [Collections.Generic.List[string]]::new()
            foreach ($target in $targets) {
              $remote = "$env:SFTP_ROOT/server/$target/$env:PROTOCOL"

              # mkdir isn't recursive, the '-' prefix ignores folders that already exist
              foreach ($folder in '', '/carbon', '/carbon/managed', '/carbon/managed/hooks') {
                $commands.Add("-mkdir `"$remote$folder`"")
              }

              foreach ($dll in 'Carbon.Hooks.Community.dll', 'Carbon.Hooks.Oxide.dll') {
                $file = "src/Carbon.Hooks/Carbon.Hooks.Generator/ftp/server/$target/$env:PROTOCOL/carbon/managed/hooks/$dll"
                if (-not (Test-Path $file)) { throw "Missing build output: $file" }
                $commands.Add("put `"$file`" `"$remote/carbon/managed/hooks/$dll`"")
              }
            }
            $commands.Add('bye')
            [IO.File]::WriteAllText($batch, ($commands -join "`n") + "`n")

            $sftp = Join-Path $env:SystemRoot 'System32\OpenSSH\sftp.exe'
            if (-not (Test-Path $sftp)) { $sftp = 'sftp' }

            & $sftp @options "$($env:SFTP_USER)@$($env:SFTP_HOST)"
            if ($LASTEXITCODE -ne 0) { throw "sftp failed with exit code $LASTEXITCODE" }
          }
          finally {
            Remove-Item $key, $knownHosts, $batch -Force -ErrorAction SilentlyContinue
          }
